---
name: update-pins

on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch:

concurrency:
  group: update-pins-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@abc  # v7
        with:
          persist-credentials: true
      - run: scripts/actlith/update-pins.sh
