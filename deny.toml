# cargo-deny policy (nix T25, V44): the fleet policy, as in congestimancer.

# Only the four supported platforms count, so Windows-only crates pulled in
# by dependencies do not trip `multiple-versions`.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
# pipelith has no runtime dependencies (V6); only MIT may ever arrive.
allow = ["MIT"]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
